[project]
name = "github-daily-video-mvp"
version = "0.1.0"
description = "MVP pipeline for GitHub daily recommendation short videos"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.12",
  "edge-tts>=7.2",
  "fastapi>=0.110",
  "pillow>=10",
  "pydantic>=2",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
